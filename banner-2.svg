  <text x="700" y="312" class="m" font-size="11" fill="#333">? for shortcuts</text>

  <!-- Prompt -->
  <text x="20" y="348" class="m" font-size="13" fill="#a3e635">›</text>
  <rect x="34" y="335" width="8" height="15" fill="#cccccc" opacity="0.75">
    <animate attributeName="opacity" values="0.75;0;0.75" dur="1.1s" repeatCount="indefinite"/>
  </rect>
