  <text class="m" font-size="13.4" fill="#a3e635" xml:space="preserve">
    <tspan x="28" y="90" >░▒▓██████▓▒░       ░▒▓███████▓▒░  </tspan>
    <tspan x="28" dy="19">░▒▓█▓▒░░▒▓█▓▒░      ░▒▓█▓▒░░▒▓█▓▒░ </tspan>
    <tspan x="28" dy="19">░▒▓█▓▒░░▒▓█▓▒░      ░▒▓█▓▒░░▒▓█▓▒░ </tspan>
    <tspan x="28" dy="19">░▒▓████████▓▒░      ░▒▓███████▓▒░  </tspan>
    <tspan x="28" dy="19">░▒▓█▓▒░░▒▓█▓▒░      ░▒▓█▓▒░░▒▓█▓▒░ </tspan>
    <tspan x="28" dy="19">░▒▓█▓▒░░▒▓█▓▒░▒▓██▓▒░▒▓█▓▒░░▒▓█▓▒░ </tspan>
    <tspan x="28" dy="19">░▒▓█▓▒░░▒▓█▓▒░▒▓██▓▒░▒▓███████▓▒░  </tspan>
  </text>

  <!-- Vertical divider -->
  <line x1="500" y1="60" x2="500" y2="292" stroke="#a3e635" stroke-width="0.8" opacity="0.25"/>

  <!-- RIGHT PANEL -->
  <text x="520" y="88"  class="m" font-size="12" fill="#a3e635" font-weight="bold">About</text>
  <line x1="520" y1="94" x2="840" y2="94" stroke="#444" stroke-width="0.6"/>
  <text x="520" y="114" class="m" font-size="12" fill="#888">infra · systems · full-stack</text>
  <text x="520" y="132" class="m" font-size="12" fill="#666">NL · EN · FR · DE</text>

  <text x="520" y="168" class="m" font-size="12" fill="#a3e635" font-weight="bold">Current project</text>
  <line x1="520" y1="174" x2="840" y2="174" stroke="#444" stroke-width="0.6"/>
  <text x="520" y="194" class="m" font-size="12" fill="#888">building </text>
  <text x="592" y="194" class="m" font-size="12" fill="#a3e635">0rion</text>
