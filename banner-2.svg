<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 370" width="860" height="370">
  <defs>
    <style>.m { font-family: 'Courier New', Courier, monospace; }</style>
  </defs>

  <rect width="860" height="370" fill="#1c1c1c"/>

  <!-- Title bar -->
