<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" width="860" height="340">
  <defs>
    <style>.m { font-family: 'Courier New', Courier, monospace; }</style>
  </defs>

  <!-- Background -->
  <rect width="860" height="340" fill="#1c1c1c"/>

  <!-- Title bar -->
  <rect width="860" height="32" fill="#1c1c1c"/>
  <circle cx="18" cy="16" r="6" fill="#ff5f57"/>
  <circle cx="38" cy="16" r="6" fill="#febc2e"/>
  <circle cx="58" cy="16" r="6" fill="#28c840"/>
  <text x="80" y="21" class="m" font-size="13" fill="#e37a51">✦ aymenbowran</text>

  <!-- Main bordered card -->
  <rect x="12" y="38" width="836" height="240" rx="4" fill="none" stroke="#e37a51" stroke-width="1.2"/>

  <!-- Card title bar -->
  <text x="20" y="56" class="m" font-size="12" fill="#e37a51">── </text>
  <text x="40" y="56" class="m" font-size="12" fill="#e37a51" font-weight="bold">Aymen Bowran</text>
  <text x="164" y="56" class="m" font-size="12" fill="#555"> @aymenbowran ──────────────────────────────────────────────────────────────</text>

  <!-- Divider between title and content -->
  <line x1="12" y1="62" x2="848" y2="62" stroke="#e37a51" stroke-width="0.8" opacity="0.4"/>

  <!-- LEFT PANEL -->
  <!-- Pixel robot sprite — hand drawn with rects -->
  <!-- Head -->
  <rect x="60"  y="80"  width="60" height="50" rx="4" fill="#e37a51"/>
  <!-- Eyes -->
  <rect x="72"  y="92"  width="12" height="12" fill="#1c1c1c"/>
  <rect x="96"  y="92"  width="12" height="12" fill="#1c1c1c"/>
  <!-- Eye shine -->
  <rect x="75"  y="94"  width="4"  height="4"  fill="#e37a51"/>
  <rect x="99"  y="94"  width="4"  height="4"  fill="#e37a51"/>
  <!-- Mouth -->
  <rect x="74"  y="112" width="32" height="4"  fill="#1c1c1c"/>
  <!-- Antenna -->
  <rect x="87"  y="72"  width="6"  height="10" fill="#e37a51"/>
  <rect x="84"  y="68"  width="12" height="6"  fill="#e37a51" rx="2"/>
  <!-- Body -->
  <rect x="50"  y="134" width="80" height="50" rx="3" fill="#e37a51"/>
  <!-- Body detail -->
  <rect x="62"  y="144" width="14" height="10" fill="#1c1c1c" rx="1"/>
  <rect x="82"  y="144" width="14" height="10" fill="#1c1c1c" rx="1"/>
  <rect x="62"  y="160" width="56" height="4"  fill="#1c1c1c" rx="1" opacity="0.5"/>
  <!-- Arms -->
  <rect x="30"  y="134" width="18" height="36" rx="3" fill="#e37a51"/>
  <rect x="132" y="134" width="18" height="36" rx="3" fill="#e37a51"/>
  <!-- Legs -->
  <rect x="62"  y="184" width="20" height="28" rx="3" fill="#e37a51"/>
  <rect x="98"  y="184" width="20" height="28" rx="3" fill="#e37a51"/>

  <!-- Welcome text -->
  <text x="200" y="98" class="m" font-size="14" fill="#e8e8e8" font-weight="bold">Welcome back, Aymen!</text>

  <!-- Info lines -->
  <text x="200" y="126" class="m" font-size="12" fill="#666">infra · systems · full-stack</text>
  <text x="200" y="148" class="m" font-size="12" fill="#666">NL · EN · FR · DE</text>
  <text x="200" y="170" class="m" font-size="12" fill="#555">~/projects/</text><text x="290" y="170" class="m" font-size="12" fill="#e37a51" font-weight="bold">0rion</text>
  <text x="200" y="192" class="m" font-size="12" fill="#444">status: </text><text x="258" y="192" class="m" font-size="12" fill="#666">— not yet.</text>

  <!-- Vertical divider -->
  <line x1="448" y1="62" x2="448" y2="278" stroke="#e37a51" stroke-width="0.8" opacity="0.4"/>

  <!-- RIGHT PANEL -->
  <text x="464" y="88" class="m" font-size="12" fill="#e37a51" font-weight="bold">Current focus</text>
  <line x1="464" y1="94" x2="836" y2="94" stroke="#555" stroke-width="0.5"/>
  <text x="464" y="114" class="m" font-size="12" fill="#888">Building 0rion. Details classified.</text>

  <text x="464" y="148" class="m" font-size="12" fill="#e37a51" font-weight="bold">Stack</text>
  <line x1="464" y1="154" x2="836" y2="154" stroke="#555" stroke-width="0.5"/>
  <text x="464" y="174" class="m" font-size="12" fill="#888">Linux · Docker · K8s · Terraform</text>
  <text x="464" y="194" class="m" font-size="12" fill="#888">Go · Rust · TypeScript · Python</text>
  <text x="464" y="214" class="m" font-size="12" fill="#888">Distributed systems · Networking</text>

  <text x="464" y="248" class="m" font-size="12" fill="#e37a51" font-weight="bold">Links</text>
  <line x1="464" y1="254" x2="836" y2="254" stroke="#555" stroke-width="0.5"/>
  <text x="464" y="272" class="m" font-size="12" fill="#4a9eff">github.com/aymenbowran</text>

  <!-- Bottom status bar -->
  <rect x="12" y="278" width="836" height="30" fill="#161616" rx="0"/>
  <rect x="12" y="278" width="836" height="1" fill="#e37a51" opacity="0.3"/>
  <text x="22" y="298" class="m" font-size="11" fill="#e37a51">✦</text>
  <text x="36" y="298" class="m" font-size="11" fill="#555">Voice mode is now available · /0rion to unlock</text>
  <text x="700" y="298" class="m" font-size="11" fill="#333">? for shortcuts</text>

  <!-- Prompt -->
  <text x="22" y="326" class="m" font-size="13" fill="#e37a51">›</text>
  <rect x="36" y="314" width="9" height="16" fill="#e8e8e8" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0;0.7" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
